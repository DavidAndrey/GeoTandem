[project]
name = "geotandem"
version = "0.1.0"
description = "GeoTandem backend"
requires-python = ">=3.13"
dependencies = [
    "geotandem-query",
    "fastapi>=0.141,<0.142",
    "uvicorn>=0.37",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.11",
    "sqlalchemy>=2.0.54,<2.1",
    "geoalchemy2>=0.20,<0.21",
    "alembic>=1.20,<2",
    "shapely>=2.1,<3",
    "pyproj>=3.8,<4",
    "pyogrio>=0.13,<0.14",
    "openpyxl>=3.1",
    "python-multipart>=0.0.20",
    "argon2-cffi>=25.1",
    "defusedxml>=0.7",
    "openai>=3.26,<4",
    "httpx2>=2.13,<3",
    "cryptography>=50,<51",
]

[project.scripts]
geotandem = "geotandem.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geotandem"]
